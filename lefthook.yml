# Lefthook configuration for Go Clean Boilerplate Monorepo
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # ─── GO BACKEND ───
    go-fmt:
      glob: '**/*.go'
      run: gofmt -w {staged_files} && git add {staged_files}

    go-vet:
      glob: '**/*.go'
      run: >
        pkgs=$(echo '{staged_files}' | tr ' ' '\n' | xargs -I{} dirname "{}" | sort -u | tr '\n' ' ');
        [ -n "$pkgs" ] && go vet $pkgs || true

    go-lint:
      glob: '**/*.go'
      run: >
        files=$(echo '{staged_files}' | tr ' ' '\n' | grep '\.go$' | sort -u | paste -sd,);
        [ -n "$files" ] && golangci-lint run --new-from-rev=HEAD || true

    # ─── FRONTEND & UI ───
    format:
      glob: '**/*.{js,ts,jsx,tsx,json,css}'
      run: pnpm exec biome format --write {staged_files} && git add {staged_files}

    # ─── VALIDATION ───
    typecheck:
      glob: '**/*.{js,ts,jsx,tsx,json,css}'
      run: pnpm turbo run typecheck

    # Temporarily disabled lint in pre-commit due to existing baseline errors
    lint:
      glob: '**/*.{js,ts,jsx,tsx,json,css}'
      run: pnpm lint
